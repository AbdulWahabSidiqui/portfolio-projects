<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product | Vertex Store</title>
    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='images/logo.png') }}"
>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', filename='css/style.css') }}"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-custom">

    <div class="container py-2">

        <a
            href="{{ url_for('main.home') }}"
            class="brand"
        >
            Vertex<span>.</span>
        </a>

        <div class="d-flex gap-2">

            <a
                href="{{ url_for('main.admin_dashboard') }}"
                class="btn btn-outline-dark"
            >
                Admin Dashboard
            </a>

            <a
                href="{{ url_for('main.logout') }}"
                class="btn btn-dark"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="mb-5">

        <p class="product-category mb-1">
            Administration
        </p>

        <h1 class="fw-bold">
            Add Product
        </h1>

        <p class="text-muted">
            Add a new product to Vertex Store.
        </p>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form method="POST">


                        <!-- Product Name -->

                        <div class="mb-4">

                            <label
                                for="name"
                                class="form-label fw-semibold"
                            >
                                Product Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                placeholder="e.g. Wireless Headphones"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-4">

                            <label
                                for="description"
                                class="form-label fw-semibold"
                            >
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="4"
                                placeholder="Describe your product..."
                                required
                            ></textarea>

                        </div>


                        <div class="row">


                            <!-- Price -->

                            <div class="col-md-6 mb-4">

                                <label
                                    for="price"
                                    class="form-label fw-semibold"
                                >
                                    Price ($)
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="price"
                                    name="price"
                                    step="0.01"
                                    min="0"
                                    placeholder="29.99"
                                    required
                                >

                            </div>


                            <!-- Stock -->

                            <div class="col-md-6 mb-4">

                                <label
                                    for="stock"
                                    class="form-label fw-semibold"
                                >
                                    Stock
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="stock"
                                    name="stock"
                                    min="0"
                                    placeholder="50"
                                    required
                                >

                            </div>

                        </div>


                        <div class="row">


                            <!-- Category -->

                            <div class="col-md-6 mb-4">

                                <label
                                    for="category"
                                    class="form-label fw-semibold"
                                >
                                    Category
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="category"
                                    name="category"
                                    placeholder="e.g. Electronics"
                                    required
                                >

                            </div>


                            <!-- Image -->

                            <div class="col-md-6 mb-4">

                                <label
                                    for="image"
                                    class="form-label fw-semibold"
                                >
                                    Image Filename
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="image"
                                    name="image"
                                    placeholder="headphones.jpg"
                                    required
                                >

                                <div class="form-text">
                                    Image must exist in
                                    static/images/
                                </div>

                            </div>

                        </div>


                        <div class="d-flex gap-2">

                            <a
                                href="{{ url_for('main.admin_dashboard') }}"
                                class="btn btn-outline-dark"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary-custom"
                            >
                                Add Product
                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container text-center">

        <strong>
            Vertex Store
        </strong>

        <p class="mb-0 mt-2">
            Flask · SQLAlchemy · Stripe · SQLite
        </p>

    </div>

</footer>


</body>
</html>
