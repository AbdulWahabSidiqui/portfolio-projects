<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product | Vertex Store</title>
    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='images/logo.png') }}"
>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="{{ url_for('static', filename='css/style.css') }}"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-custom">

    <div class="container py-2">

        <a
            href="{{ url_for('main.home') }}"
            class="brand"
        >
            Vertex<span>.</span>
        </a>

        <a
            href="{{ url_for('main.admin_dashboard') }}"
            class="btn btn-outline-dark"
        >
            Back to Dashboard
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="mb-5">

        <p class="product-category mb-1">
            Admin
        </p>

        <h1 class="fw-bold">
            Edit Product
        </h1>

        <p class="text-muted">
            Update the information for {{ product.name }}.
        </p>

    </div>


    <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ product.name }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="3"
                        required
                    >{{ product.description }}</textarea>

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-semibold">
                            Price
                        </label>

                        <input
                            type="number"
                            name="price"
                            class="form-control"
                            step="0.01"
                            min="0"
                            value="{{ product.price }}"
                            required
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-semibold">
                            Category
                        </label>

                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            value="{{ product.category }}"
                            required
                        >

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label fw-semibold">
                            Stock
                        </label>

                        <input
                            type="number"
                            name="stock"
                            class="form-control"
                            min="0"
                            value="{{ product.stock }}"
                            required
                        >

                    </div>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Image Filename
                    </label>

                    <input
                        type="text"
                        name="image"
                        class="form-control"
                        value="{{ product.image }}"
                        required
                    >

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-dark"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('main.admin_dashboard') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container text-center">

        <strong>
            Vertex Store
        </strong>

        <p class="mb-0 mt-2">
            Flask · SQLAlchemy · Stripe · SQLite
        </p>

    </div>

</footer>

</body>

</html>
